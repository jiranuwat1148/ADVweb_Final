<!-- เมนูใช้ radio/CSS เดิม พร้อม state ของ Angular -->
@if (auth.token()) {
<div class="ld-app" data-theme="lunch">
  <input class="ld-view-toggle" type="radio" name="ld-page" id="ld-nav-overview" [checked]="page() === 'overview'" (change)="setPage('overview')" aria-label="ภาพรวมการจัดส่ง">
  <input class="ld-view-toggle" type="radio" name="ld-page" id="ld-nav-orders" [checked]="page() === 'orders'" (change)="setPage('orders')" aria-label="ออเดอร์">
  <input class="ld-view-toggle" type="radio" name="ld-page" id="ld-nav-customers" [checked]="page() === 'customers'" (change)="setPage('customers')" aria-label="ลูกค้า">
  <input class="ld-view-toggle" type="radio" name="ld-page" id="ld-nav-rider" [checked]="page() === 'rider'" (change)="setPage('rider')" aria-label="ใบงานไรเดอร์">

  <div class="ld-shell">
    <aside class="ld-sidebar" aria-label="เมนูจัดการร้าน">
      <label class="ld-brand" for="ld-nav-overview">
        <span class="ld-brand-mark" aria-hidden="true">ท</span>
        <span class="ld-brand-copy"><strong>เที่ยงไว</strong><span>Lunch Dispatch</span></span>
      </label>
      <p class="ld-sidebar-label">จัดการร้านของคุณ</p>
      <nav class="ld-navigation" aria-label="เลือกหน้าจอ">
        <label class="ld-nav-item" for="ld-nav-overview">ภาพรวมการจัดส่ง</label>
        <label class="ld-nav-item" for="ld-nav-orders">ออเดอร์</label>
        <label class="ld-nav-item" for="ld-nav-customers">ลูกค้า</label>
        <label class="ld-nav-item" for="ld-nav-rider">ใบงานไรเดอร์</label>
      </nav>
      <div class="ld-sidebar-spacer" aria-hidden="true"></div>
      <div class="card ld-lunch-window">
        <strong>รอบมื้อเที่ยง</strong>
        <span>11:30 → 12:30</span>
        <p>ส่งให้ทัน ทุกมื้อมีความสุข</p>
      </div>
      <p class="ld-system-status" [class.ld-connection-error]="hasError()"><span aria-hidden="true">●</span> {{ loading() ? 'กำลังโหลดข้อมูล' : hasError() ? 'เชื่อมข้อมูลไม่สำเร็จ' : 'เชื่อม Backend แล้ว' }}</p>
      <button class="btn ld-secondary ld-logout" type="button" (click)="logout()">ออกจากระบบ ({{ auth.username() }})</button>
    </aside>

    <main class="ld-content">

      <app-overview-page [hidden]="page() !== 'overview'"></app-overview-page>
<app-order-page [hidden]="page() !== 'orders'"></app-order-page>
<app-customer-page [hidden]="page() !== 'customers'"></app-customer-page>
<app-rider-overview-page [hidden]="page() !== 'rider'"></app-rider-overview-page>

</main>
</div>
</div>
} @else {
  <app-login-page></app-login-page>
}
